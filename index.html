<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>婚礼邀请函</title>
<!--
  ============================================================
  【使用说明】
  1. 本文件是单文件请柬，图片已内嵌，可直接用微信发送给亲友。
  2. 修改文字/时间/地点：两种方式任选其一
     方式A（推荐）：打开文件 → 点右下角「编辑」按钮 → 修改后点「导出请柬」
                    得到新的 html 文件再转发（所见即所得）。
     方式B：直接编辑下方 <script id="inv-config"> 里的 JSON 文本。
  3. 更换/新增图片、视频：
     - 打开文件 → 点「编辑」→ 滚动到「相册与视频」→ 可添加网络图片地址，
       或把本地图片转成 base64 粘贴进去（可用在线工具，搜索"图片转base64"）。
     - 也可以在下方 JSON 的 photos 数组中直接增删条目：
         {"type":"image","src":"...","caption":" caption文字 "}
         {"type":"video","src":"...","poster":"封面图","caption":"视频"}
     - src 支持：base64 字符串（推荐，保证单文件可转发）、http(s) 链接。
  4. 背景音乐：把 mp3 转成 base64 后填入 music 字段（留空则不显示音乐按钮）。
  ============================================================
-->
<style>
:root{
  --bg:#f7f1e9; --bg2:#f2e5d9; --card:#fffdf9;
  --ink:#4b3441; --ink-soft:#96798a;
  --rose:#c4738f; --rose-deep:#a95475; --rose-light:#eec3d1; --blush:#f7dee6;
  --gold:#c9a06a; --gold-light:#ecd6ae;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{
  font-family:"Songti SC","STSong","SimSun","STKaiti","KaiTi",serif;
  color:var(--ink);
  background:
    radial-gradient(ellipse 90% 42% at 50% -6%, rgba(238,195,209,.55), transparent 70%),
    radial-gradient(ellipse 70% 30% at 85% 40%, rgba(236,214,174,.35), transparent 70%),
    radial-gradient(ellipse 70% 30% at 10% 75%, rgba(238,195,209,.3), transparent 70%),
    linear-gradient(180deg,var(--bg),var(--bg2) 60%,#efdfd2);
  background-attachment:fixed;
  overflow-x:hidden;
}
body.locked{overflow:hidden;height:100vh;}
/* 花瓣飘落画布 */
#petals{position:fixed;inset:0;pointer-events:none;z-index:5;}
/* ============ 封面 ============ */
#cover{
  position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  background:
    radial-gradient(ellipse 80% 50% at 50% 22%, #fdeef3 0%, transparent 60%),
    radial-gradient(ellipse at 50% 100%, #f2ddc9 0%, transparent 55%),
    linear-gradient(180deg,#faf4ec,#f5e6da);
  transition:transform 1.1s cubic-bezier(.7,0,.3,1), opacity 1.1s ease;
}
#cover.open{transform:translateY(-105%);opacity:.6;}
#cover::before{
  content:"";position:absolute;inset:14px;border:1px solid rgba(196,115,143,.4);
  border-radius:18px;pointer-events:none;
}
#cover::after{
  content:"";position:absolute;inset:21px;border:1px solid rgba(201,160,106,.3);
  border-radius:14px;pointer-events:none;
}
.cover-ornament{font-size:13px;letter-spacing:.62em;color:var(--gold);opacity:.9;margin-bottom:26px;text-indent:.62em;font-family:Georgia,serif;}
.seal{
  width:158px;height:158px;border-radius:50%;position:relative;cursor:pointer;
  background:radial-gradient(circle at 35% 30%, #eba9c0, #c4738f 58%, #a95475);
  border:2px solid #e6cfa0;
  box-shadow:0 0 0 6px rgba(201,160,106,.18), 0 14px 40px rgba(169,84,117,.4), inset 0 0 26px rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;
  animation:sealPulse 2.6s ease-in-out infinite;
  transition:transform .3s;
}
.seal:active{transform:scale(.94);}
@keyframes sealPulse{0%,100%{box-shadow:0 0 0 6px rgba(201,160,106,.18),0 14px 40px rgba(169,84,117,.4),inset 0 0 26px rgba(255,255,255,.25);}
  50%{box-shadow:0 0 0 14px rgba(201,160,106,.3),0 14px 40px rgba(169,84,117,.4),inset 0 0 26px rgba(255,255,255,.25);}}
.seal span{font-size:72px;color:#fff8f2;font-family:"STKaiti","KaiTi",serif;
  text-shadow:0 2px 10px rgba(122,42,72,.45);line-height:1;transform:translateY(-2px);}
.cover-names{margin-top:34px;font-size:26px;letter-spacing:.35em;text-indent:.35em;color:var(--rose-deep);}
.cover-date{margin-top:12px;font-size:14px;letter-spacing:.3em;color:var(--ink-soft);}
.cover-hint{margin-top:44px;font-size:13px;letter-spacing:.4em;color:var(--rose);opacity:.9;animation:hintFloat 1.8s ease-in-out infinite;}
@keyframes hintFloat{0%,100%{transform:translateY(0);opacity:.9;}50%{transform:translateY(6px);opacity:.5;}}
.share-cover{width:196px;border-radius:14px;display:block;margin-bottom:30px;box-shadow:0 14px 36px rgba(169,84,117,.25);position:relative;z-index:2;}
.share-cover.hide{display:none;}
.cover-names,.cover-date{display:none;}
/* ============ 主体 ============ */
#page{visibility:hidden;}
#page.show{visibility:visible;}
section{position:relative;padding:64px 22px;max-width:520px;margin:0 auto;}
.sec-label{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:10px;}
.sec-label i{display:block;width:44px;height:1px;background:linear-gradient(90deg,transparent,var(--rose));}
.sec-label i:last-child{background:linear-gradient(90deg,var(--rose),transparent);}
.sec-label em{font-style:normal;font-size:13px;letter-spacing:.5em;text-indent:.5em;color:var(--rose);}
.sec-title{text-align:center;font-size:26px;letter-spacing:.25em;text-indent:.25em;color:var(--ink);margin-bottom:36px;font-weight:normal;}
.reveal{opacity:0;transform:translateY(36px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.3,1);}
.reveal.in{opacity:1;transform:none;}
/* ---- 首屏 ---- */
#hero{text-align:center;padding-top:90px;}
.hero-frame{
  width:min(78vw,320px);margin:0 auto;padding:10px;position:relative;
  border:1px solid rgba(201,160,106,.7);border-radius:200px 200px 14px 14px;
  background:rgba(255,253,249,.7);
  box-shadow:0 20px 50px rgba(169,84,117,.18);
}
.hero-frame::before{content:"";position:absolute;inset:5px;border:1px solid rgba(196,115,143,.3);border-radius:195px 195px 10px 10px;pointer-events:none;}
.hero-photo{
  width:100%;aspect-ratio:3/4;object-fit:cover;display:block;
  border-radius:190px 190px 8px 8px;
}
.hero-kicker{margin-top:34px;font-size:13px;letter-spacing:.55em;text-indent:.55em;color:var(--gold);opacity:.95;}
.hero-names{margin-top:18px;display:flex;align-items:center;justify-content:center;gap:20px;}
.hero-names .n{font-size:34px;letter-spacing:.18em;color:var(--rose-deep);font-family:"STKaiti","KaiTi",serif;}
.hero-names .amp{font-size:22px;color:var(--rose);opacity:.85;font-family:Georgia,serif;font-style:italic;}
.hero-date{margin-top:22px;font-size:16px;letter-spacing:.28em;text-indent:.28em;color:var(--ink);}
.hero-line{width:120px;height:1px;margin:30px auto 0;background:linear-gradient(90deg,transparent,var(--rose),transparent);}
/* ---- 邀请信 ---- */
.letter{
  background:var(--card);color:var(--ink);
  border-radius:14px;padding:38px 30px;position:relative;
  box-shadow:0 18px 46px rgba(169,84,117,.16);
  border:1px solid rgba(238,195,209,.6);
}
.letter::before{content:"";position:absolute;inset:8px;border:1px dashed rgba(196,115,143,.35);border-radius:10px;pointer-events:none;}
.letter h3{font-size:20px;letter-spacing:.3em;text-align:center;color:var(--rose-deep);margin-bottom:26px;font-weight:normal;}
.letter p{font-size:15.5px;line-height:2.1;letter-spacing:.08em;text-indent:2em;margin-bottom:6px;}
.letter .sign{text-align:right;margin-top:22px;font-size:14.5px;letter-spacing:.15em;color:var(--ink-soft);}
.letter .seal-mini{
  position:absolute;right:26px;bottom:64px;width:52px;height:52px;border-radius:50%;
  border:1.5px solid var(--rose);color:var(--rose);display:flex;align-items:center;justify-content:center;
  font-size:26px;font-family:"STKaiti","KaiTi",serif;transform:rotate(-12deg);opacity:.7;
}
/* ---- 倒计时 ---- */
#count{display:flex;justify-content:center;gap:12px;margin-top:6px;}
#count .cell{
  min-width:66px;padding:14px 8px 12px;text-align:center;border-radius:12px;
  background:var(--card);border:1px solid rgba(238,195,209,.8);
  box-shadow:0 8px 22px rgba(169,84,117,.1);
}
#count .num{font-size:30px;color:var(--rose-deep);font-variant-numeric:tabular-nums;line-height:1;}
#count .lab{margin-top:8px;font-size:12px;letter-spacing:.3em;text-indent:.3em;color:var(--ink-soft);}
.count-tip{text-align:center;margin-top:20px;font-size:14px;letter-spacing:.2em;color:var(--ink-soft);}
/* ---- 相册 ---- */
.gallery{display:flex;gap:18px;overflow-x:auto;padding:14px 6px 26px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.gallery::-webkit-scrollbar{display:none;}
.polaroid{
  flex:0 0 auto;width:236px;scroll-snap-align:center;background:#fff;padding:12px 12px 46px;
  border-radius:6px;box-shadow:0 14px 34px rgba(169,84,117,.22);position:relative;transform:rotate(var(--rot,0deg));
  transition:transform .35s;
}
.polaroid:active{transform:rotate(0deg) scale(1.03);}
.polaroid img,.polaroid video{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#eee;border-radius:3px;}
.polaroid video{aspect-ratio:16/10;}
.polaroid figcaption{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:13.5px;letter-spacing:.15em;color:#7a5f6e;font-family:"STKaiti","KaiTi",serif;}
.polaroid .pin{position:absolute;top:-9px;left:50%;transform:translateX(-50%);width:18px;height:18px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#f3d9e2,var(--rose));box-shadow:0 3px 6px rgba(169,84,117,.4);}
.gal-hint{text-align:center;font-size:12px;letter-spacing:.35em;color:rgba(169,84,117,.5);}
/* ---- 流程 ---- */
.timeline{position:relative;padding-left:30px;}
.timeline::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:1px;background:linear-gradient(180deg,var(--rose),rgba(196,115,143,.15));}
.t-item{position:relative;padding:0 0 34px 22px;}
.t-item:last-child{padding-bottom:0;}
.t-item::before{content:"";position:absolute;left:-30px;top:6px;width:15px;height:15px;border-radius:50%;
  background:var(--rose);border:2px solid #fff;box-shadow:0 0 0 4px rgba(196,115,143,.2);}
.t-time{font-size:15px;color:var(--rose-deep);letter-spacing:.15em;font-variant-numeric:tabular-nums;}
.t-name{font-size:18px;margin-top:6px;letter-spacing:.2em;color:var(--ink);}
.t-desc{font-size:13px;margin-top:5px;color:var(--ink-soft);letter-spacing:.1em;}
/* ---- 地点 ---- */
.venue-card{
  background:var(--card);border:1px solid rgba(238,195,209,.7);border-radius:14px;
  padding:26px 24px;margin-bottom:22px;
  box-shadow:0 12px 32px rgba(169,84,117,.12);
}
.venue-tag{display:inline-block;font-size:12px;letter-spacing:.35em;text-indent:.35em;color:#fff;
  background:linear-gradient(120deg,var(--rose),var(--rose-deep));padding:5px 14px 5px 18px;border-radius:20px;margin-bottom:16px;}
.venue-name{font-size:21px;letter-spacing:.12em;color:var(--ink);}
.venue-addr{margin-top:12px;font-size:14.5px;line-height:1.9;color:var(--ink-soft);letter-spacing:.06em;}
.venue-btns{display:flex;gap:12px;margin-top:18px;}
.btn{
  flex:1;text-align:center;padding:12px 0;font-size:14px;letter-spacing:.2em;text-indent:.2em;
  border-radius:24px;cursor:pointer;text-decoration:none;color:var(--rose-deep);
  border:1px solid var(--rose);background:rgba(196,115,143,.08);transition:background .25s;
  font-family:inherit;
}
.btn:active{background:rgba(196,115,143,.22);}
.btn.solid{background:linear-gradient(120deg,var(--rose),var(--rose-deep));color:#fff;font-weight:bold;border:none;box-shadow:0 8px 20px rgba(169,84,117,.3);}
/* ---- RSVP ---- */
.rsvp{background:var(--card);color:var(--ink);border-radius:14px;padding:34px 26px;box-shadow:0 18px 46px rgba(169,84,117,.16);border:1px solid rgba(238,195,209,.6);}
.rsvp h3{text-align:center;font-size:19px;letter-spacing:.3em;color:var(--rose-deep);margin-bottom:24px;font-weight:normal;}
.f-row{margin-bottom:16px;}
.f-row label{display:block;font-size:13px;letter-spacing:.25em;color:var(--ink-soft);margin-bottom:7px;}
.f-row input,.f-row select,.f-row textarea{
  width:100%;padding:12px 14px;font-size:15px;border-radius:10px;border:1px solid #e8cfd9;
  background:#fff;color:var(--ink);font-family:inherit;letter-spacing:.05em;outline:none;
}
.f-row input:focus,.f-row textarea:focus,.f-row select:focus{border-color:var(--rose);}
.f-row textarea{resize:none;height:76px;}
.rsvp .btn{border-color:var(--rose);color:var(--rose-deep);background:rgba(196,115,143,.08);}
.rsvp .btn.solid{background:linear-gradient(120deg,var(--rose),var(--rose-deep));color:#fff;border:none;}
/* ---- 结尾 ---- */
#fin{text-align:center;padding-bottom:120px;}
.fin-photo{width:120px;height:120px;object-fit:cover;border-radius:50%;border:2px solid rgba(201,160,106,.8);padding:5px;margin:0 auto 26px;display:block;box-shadow:0 12px 30px rgba(169,84,117,.2);}
.fin-text{font-size:16px;letter-spacing:.3em;line-height:2.2;color:var(--ink-soft);}
.fin-names{margin-top:26px;font-size:20px;letter-spacing:.3em;color:var(--rose-deep);}
/* ---- 悬浮控件 ---- */
.fab{
  position:fixed;right:16px;bottom:18px;z-index:60;width:48px;height:48px;border-radius:50%;
  background:linear-gradient(140deg,var(--rose),var(--rose-deep));color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:21px;cursor:pointer;
  box-shadow:0 6px 18px rgba(169,84,117,.4);border:none;font-family:inherit;
  transition:transform .25s;
}
.fab:active{transform:scale(.9);}
#musicBtn{display:none;}
/* ---- 编辑面板 ---- */
#editor{
  position:fixed;inset:0;z-index:200;background:rgba(66,40,54,.97);overflow-y:auto;
  padding:22px 20px 60px;display:none;
}
#editor.open{display:block;}
#editor h2{color:#f6dde5;font-size:20px;letter-spacing:.25em;text-align:center;margin:14px 0 6px;font-weight:normal;}
#editor .sub{text-align:center;font-size:12px;color:rgba(246,222,230,.55);letter-spacing:.15em;margin-bottom:24px;}
.e-group{margin-bottom:26px;}
.e-group h4{color:var(--rose-light);font-size:13px;letter-spacing:.4em;margin-bottom:12px;border-bottom:1px solid rgba(238,195,209,.25);padding-bottom:8px;}
.e-field{margin-bottom:12px;}
.e-field label{display:block;font-size:12.5px;color:rgba(246,222,230,.7);letter-spacing:.15em;margin-bottom:5px;}
.e-field input,.e-field textarea{
  width:100%;padding:10px 12px;font-size:15px;border-radius:6px;border:1px solid rgba(238,195,209,.4);
  background:rgba(255,255,255,.08);color:#fdf3f6;font-family:inherit;outline:none;
}
.e-field textarea{height:90px;resize:vertical;}
.e-photo{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px;}
.e-photo img{width:52px;height:52px;object-fit:cover;border-radius:6px;border:1px solid rgba(238,195,209,.4);flex:0 0 auto;}
.e-photo .e-field{flex:1;}
.e-del{background:none;border:1px solid rgba(196,115,143,.9);color:#e8a4bc;border-radius:6px;width:36px;height:36px;flex:0 0 auto;cursor:pointer;font-size:16px;}
.e-add{width:100%;padding:11px;border:1px dashed rgba(238,195,209,.5);color:var(--rose-light);background:none;border-radius:6px;font-size:14px;letter-spacing:.2em;cursor:pointer;font-family:inherit;}
.e-actions{display:flex;gap:12px;margin-top:30px;}
/* toast */
#toast{
  position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);z-index:300;
  background:rgba(75,52,65,.92);border:1px solid var(--rose);color:#fbe9f0;
  padding:11px 22px;border-radius:30px;font-size:13.5px;letter-spacing:.15em;
  opacity:0;pointer-events:none;transition:all .35s;white-space:nowrap;max-width:86vw;overflow:hidden;text-overflow:ellipsis;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body class="locked">

<canvas id="petals"></canvas>

<!-- ================= 封面信封 ================= -->
<div id="cover">
  <div class="cover-ornament">WEDDING INVITATION</div>
  <img class="share-cover" src="share-cover.png" alt="吴文涛&樊欣媛 婚礼邀请函" onerror="this.classList.add('hide')">
  <div class="seal" id="sealBtn"><span>囍</span></div>
  <div class="cover-names" id="coverNames"></div>
  <div class="cover-date" id="coverDate"></div>
  <div class="cover-hint">轻 启 封 印 · 共 赴 佳 期</div>
</div>

<!-- ================= 请柬主体 ================= -->
<div id="page">

  <section id="hero">
    <div class="reveal">
      <div class="hero-frame"><img class="hero-photo" id="heroImg" alt="新人照片"></div>
      <div class="hero-kicker">吾 家 有 喜 · 敬 备 喜 宴</div>
      <div class="hero-names">
        <span class="n" data-cfg="groom"></span>
        <span class="amp">&amp;</span>
        <span class="n" data-cfg="bride"></span>
      </div>
      <div class="hero-date"><span data-cfg="dateText"></span> · <span data-cfg="timeText"></span></div>
      <div class="hero-line"></div>
    </div>
  </section>

  <section id="invitation">
    <div class="sec-label reveal"><i></i><em>诚挚邀请</em><i></i></div>
    <h2 class="sec-title reveal" data-cfg="inviteTitle"></h2>
    <div class="letter reveal">
      <h3>婚礼邀请函</h3>
      <p data-cfg="inviteText"></p>
      <div class="sign">—— <span data-cfg="groom"></span> &amp; <span data-cfg="bride"></span> 敬邀</div>
      <div class="seal-mini">囍</div>
    </div>
  </section>

  <section id="countdownSec">
    <div class="sec-label reveal"><i></i><em>佳期将至</em><i></i></div>
    <h2 class="sec-title reveal">倒计时</h2>
    <div id="count" class="reveal">
      <div class="cell"><div class="num" id="cd-d">--</div><div class="lab">天</div></div>
      <div class="cell"><div class="num" id="cd-h">--</div><div class="lab">时</div></div>
      <div class="cell"><div class="num" id="cd-m">--</div><div class="lab">分</div></div>
      <div class="cell"><div class="num" id="cd-s">--</div><div class="lab">秒</div></div>
    </div>
    <div class="count-tip reveal">我们结婚啦，等你来见证 ❤</div>
  </section>

  <section id="album">
    <div class="sec-label reveal"><i></i><em>甜蜜瞬间</em><i></i></div>
    <h2 class="sec-title reveal">我们的回忆</h2>
    <div class="gallery reveal" id="gallery"></div>
    <div class="gal-hint reveal">← 左右滑动查看更多 →</div>
  </section>

  <section id="schedule">
    <div class="sec-label reveal"><i></i><em>当日流程</em><i></i></div>
    <h2 class="sec-title reveal">婚礼日程</h2>
    <div class="timeline reveal" id="timeline"></div>
  </section>

  <section id="venue">
    <div class="sec-label reveal"><i></i><em>宴席地点</em><i></i></div>
    <h2 class="sec-title reveal">宴会信息</h2>
    <div class="venue-card reveal">
      <div class="venue-tag">草坪婚礼</div>
      <div class="venue-name" data-cfg="lawnName"></div>
      <div class="venue-addr" data-cfg="lawnAddress"></div>
      <div class="venue-btns">
        <a class="btn" id="copyVenue">复制地址</a>
        <a class="btn solid" id="mapVenue" target="_blank">导航前往</a>
      </div>
    </div>
    <div class="venue-card reveal">
      <div class="venue-tag">喜宴宴席</div>
      <div class="venue-name" data-cfg="banquetName"></div>
      <div class="venue-addr" data-cfg="banquetAddress"></div>
      <div class="venue-btns">
        <a class="btn" id="copyBanquet">复制地址</a>
        <a class="btn solid" id="mapBanquet" target="_blank">导航前往</a>
      </div>
    </div>
  </section>

  <section id="rsvpSec">
    <div class="sec-label reveal"><i></i><em>赴宴回执</em><i></i></div>
    <h2 class="sec-title reveal">RSVP · 敬请回复</h2>
    <form class="rsvp reveal" id="rsvpForm">

<script>
(function(){
"use strict";
/* ---------- 读取配置 ---------- */
var CFG = JSON.parse(document.getElementById('inv-config').textContent);

/* ---------- 渲染 ---------- */
function setText(key){
  var els = document.querySelectorAll('[data-cfg="'+key+'"]');
  for(var i=0;i<els.length;i++) els[i].textContent = CFG[key]||'';
}
function renderAll(){
  ['groom','bride','dateText','timeText','lawnName','lawnAddress',
   'banquetName','banquetAddress','inviteTitle','inviteText'].forEach(setText);
  document.title = '婚礼邀请函 · '+CFG.groom+'&'+CFG.bride;
  document.getElementById('coverNames').textContent = CFG.groom+' & '+CFG.bride;
  document.getElementById('coverDate').textContent = CFG.dateText+' '+CFG.timeText;
  var img = (CFG.photos && CFG.photos.length && CFG.photos[0].type==='image') ? CFG.photos[0].src : '';
  if(img){ document.getElementById('heroImg').src = img; document.getElementById('finImg').src = img; }
  // 相册
  var gal = document.getElementById('gallery'); gal.innerHTML='';
  var rots = [-2.5, 2, -1.5, 2.5, -2];
  (CFG.photos||[]).forEach(function(p, idx){
    var fig = document.createElement('figure');
    fig.className='polaroid';
    fig.style.setProperty('--rot', rots[idx%rots.length]+'deg');
    var pin = document.createElement('i'); pin.className='pin'; fig.appendChild(pin);
    var media;
    if(p.type==='video'){
      media = document.createElement('video');
      media.src = p.src; media.controls = true; media.playsInline = true; media.preload='metadata';
      if(p.poster) media.poster = p.poster;
    }else{
      media = document.createElement('img');
      media.src = p.src; media.alt = p.caption||'';
      media.loading = 'lazy';
    }
    fig.appendChild(media);
    var cap = document.createElement('figcaption'); cap.textContent = p.caption||''; fig.appendChild(cap);
    gal.appendChild(fig);
  });
  // 流程
  var tl = document.getElementById('timeline'); tl.innerHTML='';
  (CFG.schedule||[]).forEach(function(s){
    var d = document.createElement('div'); d.className='t-item';
    d.innerHTML = '<div class="t-time">'+esc(s.time)+'</div><div class="t-name">'+esc(s.name)+'</div><div class="t-desc">'+esc(s.desc||'')+'</div>';
    tl.appendChild(d);
  });
  // 导航链接
  document.getElementById('mapVenue').href = 'https://uri.amap.com/search?keyword='+encodeURIComponent(CFG.lawnName);
  document.getElementById('mapBanquet').href = 'https://uri.amap.com/search?keyword='+encodeURIComponent(CFG.banquetName);
  // 音乐按钮
  var mb = document.getElementById('musicBtn');
  if(CFG.music){ mb.style.display='flex'; audio = new Audio(CFG.music); audio.loop = true; audio.volume = .7; }
  else { mb.style.display='none'; }
  tick(); // 刷新倒计时
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

/* ---------- 封面开启 ---------- */
var opened = false;
document.getElementById('sealBtn').addEventListener('click', function(){
  if(opened) return; opened = true;
  document.getElementById('cover').classList.add('open');
  document.getElementById('page').classList.add('show');
  document.body.classList.remove('locked');
  startPetals();
  if(audio){ audio.play().catch(function(){}); }
  setTimeout(function(){ document.getElementById('cover').style.display='none'; }, 1200);
});

/* ---------- 倒计时 ---------- */
var target = null, tickToken = 0;
function tick(){
  if(!CFG.dateISO) return;
  target = new Date(CFG.dateISO).getTime();
  var my = ++tickToken;
  function pad(n){ return (n<10?'0':'')+n; }
  function run(){
    if(my !== tickToken) return; // 已有新的计时循环，旧循环退出
    var diff = target - Date.now();
    if(diff <= 0){
      document.getElementById('cd-d').textContent='00';
      document.getElementById('cd-h').textContent='00';
      document.getElementById('cd-m').textContent='00';
      document.getElementById('cd-s').textContent='00';
      return;
    }
    var s = Math.floor(diff/1000);
    document.getElementById('cd-d').textContent = pad(Math.floor(s/86400));
    document.getElementById('cd-h').textContent = pad(Math.floor(s%86400/3600));
    document.getElementById('cd-m').textContent = pad(Math.floor(s%3600/60));
    document.getElementById('cd-s').textContent = pad(s%60);
    setTimeout(run, 1000);
  }
  run();
}

/* ---------- 滚动显现 ---------- */
var io = new IntersectionObserver(function(entries){
  entries.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
},{threshold:.12});
document.querySelectorAll('.reveal').forEach(function(el){ io.observe(el); });

/* ---------- 金粉花瓣 ---------- */
var petalsOn = false;
function startPetals(){
  if(petalsOn) return; petalsOn = true;
  var cv = document.getElementById('petals'), ctx = cv.getContext('2d');
  function size(){ cv.width = innerWidth; cv.height = innerHeight; }
  size(); addEventListener('resize', size);
  var P = [], N = innerWidth < 500 ? 26 : 40;
  function mk(y){ return {
    x: Math.random()*cv.width, y: y!=null?y:-20,
    s: 3+Math.random()*5, vy: .4+Math.random()*.9, vx: (Math.random()-.5)*.5,
    rot: Math.random()*Math.PI*2, vr: (Math.random()-.5)*.03,
    sway: Math.random()*Math.PI*2, gold: Math.random()<.35, o:.35+Math.random()*.45 }; }
  for(var i=0;i<N;i++) P.push(mk(Math.random()*cv.height));
  (function loop(){
    ctx.clearRect(0,0,cv.width,cv.height);
    P.forEach(function(p,i){
      p.sway += .02; p.x += p.vx + Math.sin(p.sway)*.6; p.y += p.vy; p.rot += p.vr;
      if(p.y > cv.height+20) P[i] = mk();
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.globalAlpha = p.o;
      ctx.fillStyle = p.gold ? '#e6c894' : '#e8a4bc';
      ctx.beginPath(); ctx.ellipse(0,0,p.s,p.s*.55,0,0,Math.PI*2); ctx.fill();
      ctx.restore();
    });
    requestAnimationFrame(loop);
  })();
}

  else{ audio.play().catch(function(){}); this.textContent='❚❚'; this.style.opacity=1; }

/* ---------- 复制 / toast ---------- */
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove('show'); }, 2200);
}
function copyText(txt, ok){
  function done(){ toast(ok||'已复制'); }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done, function(){ legacy(); });
  } else legacy();
  function legacy(){
    var ta = document.createElement('textarea');
    ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ toast('复制失败，请长按选择'); }
    document.body.removeChild(ta);
  }
}
document.getElementById('copyVenue').addEventListener('click', function(){ copyText(CFG.lawnName+' '+CFG.lawnAddress,'地址已复制'); });
document.getElementById('copyBanquet').addEventListener('click', function(){ copyText(CFG.banquetName+' '+CFG.banquetAddress,'地址已复制'); });

/* ================= 编辑模式 ================= */
var TEXT_FIELDS = [
  {k:'groom', l:'新郎姓名'}, {k:'bride', l:'新娘姓名'},
  {k:'dateText', l:'日期（显示文字，如 2026年11月8日 星期日）'},
  {k:'dateISO', l:'日期（倒计时用，格式 2026-11-08T11:28:00+08:00）'},
  {k:'timeText', l:'时间（显示文字，如 11:28）'},
  {k:'venueName', l:'仪式地点名称'}, {k:'venueAddress', l:'仪式详细地址'},
  {k:'banquetName', l:'宴席地点名称'}, {k:'banquetAddress', l:'宴席详细地址'},
  {k:'lawnName', l:'草坪婚礼地点名称'}, {k:'lawnAddress', l:'草坪婚礼地址与时间'},
  {k:'inviteTitle', l:'邀请语标题'}, {k:'inviteText', l:'邀请语正文', ta:true},
  {k:'phone', l:'新人联系电话'},
  {k:'music', l:'背景音乐（base64 或链接，留空隐藏按钮）'}
];
var editor = document.getElementById('editor'), body = document.getElementById('editorBody');

function openEditor(){
  body.innerHTML='';
  // 文本字段
  var g = document.createElement('div'); g.className='e-group';
  g.innerHTML = '<h4>文字内容</h4>';
  TEXT_FIELDS.forEach(function(f){
    g.appendChild(mkField(f.l, CFG[f.k], function(v){ CFG[f.k]=v; }));
  });
  body.appendChild(g);
  // 流程
  var g2 = document.createElement('div'); g2.className='e-group';
  g2.innerHTML = '<h4>婚礼流程</h4>';
  CFG.schedule.forEach(function(s, i){
    var row = document.createElement('div'); row.className='e-photo';
    var wrap = document.createElement('div'); wrap.style.flex='1';
    wrap.appendChild(mkField('时间', s.time, function(v){ s.time=v; }));
    wrap.appendChild(mkField('环节', s.name, function(v){ s.name=v; }));
    wrap.appendChild(mkField('说明', s.desc||'', function(v){ s.desc=v; }));
    var del = document.createElement('button'); del.className='e-del'; del.textContent='×';
    del.onclick = function(){ CFG.schedule.splice(i,1); openEditor(); };
    row.appendChild(wrap); row.appendChild(del);
    g2.appendChild(row);
  });
  var addS = document.createElement('button'); addS.className='e-add'; addS.textContent='＋ 添加流程';
  addS.onclick = function(){ CFG.schedule.push({time:'',name:'',desc:''}); openEditor(); };
  g2.appendChild(addS);
  body.appendChild(g2);
  // 相册
  var g3 = document.createElement('div'); g3.className='e-group';
  g3.innerHTML = '<h4>相册与视频</h4>';
  CFG.photos.forEach(function(p, i){
    var row = document.createElement('div'); row.className='e-photo';
    if(p.type==='image'){ var im=document.createElement('img'); im.src=p.src; row.appendChild(im); }
    var wrap = document.createElement('div'); wrap.style.flex='1';
    wrap.appendChild(mkField(p.type==='video'?'视频地址（base64或链接）':'图片地址（base64或链接，很长属正常）',
      p.src, function(v){ p.src=v; }, p.type==='image'));
    wrap.appendChild(mkField('说明文字', p.caption||'', function(v){ p.caption=v; }));
    var del = document.createElement('button'); del.className='e-del'; del.textContent='×';
    del.onclick = function(){ CFG.photos.splice(i,1); openEditor(); };
    row.appendChild(wrap); row.appendChild(del);
    g3.appendChild(row);
  });
  var addI = document.createElement('button'); addI.className='e-add'; addI.textContent='＋ 添加图片';
  addI.onclick = function(){ CFG.photos.push({type:'image',src:'',caption:''}); openEditor(); };
  var addV = document.createElement('button'); addV.className='e-add'; addV.textContent='＋ 添加视频'; addV.style.marginTop='8px';
  addV.onclick = function(){ CFG.photos.push({type:'video',src:'',poster:'',caption:''}); openEditor(); };
  g3.appendChild(addI); g3.appendChild(addV);
  body.appendChild(g3);
  editor.classList.add('open');
}
function mkField(label, val, onchange, isLong){
  var d = document.createElement('div'); d.className='e-field';
  var lb = document.createElement('label'); lb.textContent = label; d.appendChild(lb);
  var inp = document.createElement(isLong ? 'textarea' : 'input');
  inp.value = val==null ? '' : val;
  inp.addEventListener('input', function(){ onchange(inp.value); });
  d.appendChild(inp);
  return d;
}
document.getElementById('editBtn').addEventListener('click', function(){
  if(!opened){ // 未开信封时也可编辑，直接打开面板
  }
  openEditor();
});
document.getElementById('edCancel').addEventListener('click', function(){
  editor.classList.remove('open');
  renderAll(); // 应用已修改内容
  toast('修改已应用（未导出则下次打开失效）');
});
document.getElementById('edExport').addEventListener('click', function(){
  // 序列化当前文档，替换配置 JSON，导出为新文件
  CFG.photos = CFG.photos.filter(function(p){ return p.src; });
  var html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  var json = JSON.stringify(CFG, null, 2).replace(/<\/script>/gi, '<\\/script>');
  html = html.replace(/(<script id="inv-config" type="application\/json">)[\s\S]*?(<\/script>)/,
    function(m, a, b){ return a + '\n' + json + '\n' + b; });
  var blob = new Blob([html], {type:'text/html;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '婚礼请柬-' + CFG.groom + '&' + CFG.bride + '.html';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
  editor.classList.remove('open');
  renderAll();
  toast('已导出，请转发新文件给亲友');
});

renderAll();
})();
</script>
